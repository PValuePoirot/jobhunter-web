name: job-pool
on:
  schedule: [{cron: "*/30 * * * *"}]   # public repo: Actions minutes are free
  workflow_dispatch:
concurrency: job-pool
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Restore source state (per-source fetch intervals)
        uses: actions/cache@v4
        with:
          path: ingest/data
          key: pool-state-${{ github.run_id }}
          restore-keys: pool-state-
      - name: Fetch ~170 sources and publish to Supabase
        working-directory: ingest
        run: python3 pool.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          JOOBLE_API_KEY: ${{ secrets.JOOBLE_API_KEY }}
